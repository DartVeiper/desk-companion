# Состав и порядок экранов. Убрать режим = убрать строку, кода это не
# касается — пункт «система виджетов как модулей» из бэклога п.12.

[screens]
enabled = [
    "clock.ClockScreen",        # 1. Часы + погода
    "activity.ActivityScreen",  # 2. Активность
    "away.AwayScreen",          # 3. Меня нет
    "manual.ManualScreen",      # 4. Ручной статус
    "hardware.HardwareScreen",  # 5. GPU / CPU
    "anomaly.AnomalyScreen",    # 6. ML-аномалия
    "streak.StreakScreen",      # 7. Стрик привычек
]

# Куда уводит долгое нажатие (0,7 с) с энкодера или с тача.
manual = "manual"

# Куда уводит очень долгое удержание (3 с). В карусель не входит:
# долистать до настроек случайно нельзя.
settings = "settings.SettingsScreen"

# Экраны покоя: включаются, когда радар не видит присутствия. В карусель
# не входят — стиль выбирается новый при каждом входе.
[ambient]
enabled = [
    "ambient.BigDigitsAmbient",
    "ambient.MatrixAmbient",
    "ambient.NightRedAmbient",
]

# Сколько ждать без присутствия перед уходом в покой. Меньше двух минут
# ставить не стоит: радар периодически теряет неподвижного человека, и
# экран начнёт дёргаться туда-сюда прямо во время работы.
away_delay_minutes = 3

# Ночью принудительно ночной стиль, независимо от очереди.
night_style = "ambient_night"
night_from = 23
night_to = 7

# ---------------------------------------------------------------------------
# Железо. Номера — GPIO (BCM), не физические номера ножек.
# Физическая распиновка: раздел 10.5 плана, уточнённый под ST7796S с тачем.
# ---------------------------------------------------------------------------
[display]
# CS у экрана — CE0, значит /dev/spidev0.0
spi_bus = 0
spi_device = 0
# 32 МГц, а не 40: на проводах-перемычках 10 см сорок держатся неустойчиво.
# Если пойдут помехи по картинке — снижать.
speed_hz = 32000000
dc = 25          # pin 22
reset = 24       # pin 18
backlight = 18   # pin 12, аппаратный PWM
rotation_bgr = true   # у красных модулей порядок цветов BGR; синий вместо
                      # красного означает, что надо поставить false

[touch]
# Свой чип-селект CE1 -> /dev/spidev0.1, и своя скорость: XPT2046 больше
# двух мегагерц не держит, тогда как экран идёт на 32.
spi_bus = 0
spi_device = 1
speed_hz = 2000000
# Границы сырых значений АЦП. Свои для каждого экземпляра — заполняются
# скриптом tools/touch_calibrate.py, пока стоят типовые.
x_min = 300
x_max = 3800
y_min = 300
y_max = 3800
swap_xy = true
invert_x = false
invert_y = true
# Выше этого сопротивления касания нет. Подобрать на живой панели: снять
# значение при уверенном нажатии и при пустом экране, взять середину.
max_resistance = 2000

[encoder]
clk = 17   # pin 11
dt = 27    # pin 13
sw = 22    # pin 15

[radar]
port = "/dev/serial0"
# Заводская скорость LD2410 именно такая, не 115200.
baud = 256000
# Инженерный режим даёт энергию по 9 воротам дальности — без неё панель
# калибровки бесполезна.
engineering = true

[air]
# П.6 плана: самокалибровку отключаем, иначе в редко проветриваемой
# комнате ноль CO2 медленно уезжает.
disable_asc = true
# Поправка на собственный нагрев платы в закрытом корпусе. Подобрать
# сверкой с референсным термометром в первый день (п.9).
temperature_offset = 0.0
