# Состав и порядок экранов. Убрать режим = убрать строку, кода это не
# касается — пункт «система виджетов как модулей» из бэклога п.12.

[screens]
enabled = [
    "clock.ClockScreen",        # 1. Часы + погода
    "details.WeatherDetail",    # 2. Погода подробно
    "details.AirDetail",        # 3. Воздух подробно
    "activity.ActivityScreen",  # 4. Активность
    "away.AwayScreen",          # 3. Меня нет
    "hardware.HardwareScreen",  # 5. GPU / CPU
    "anomaly.AnomalyScreen",    # 6. ML-аномалия
    "streak.StreakScreen",      # 7. Стрик привычек
]

# Куда уводит долгое нажатие (0,7 с) с энкодера или с тача. В карусель
# НЕ входит намеренно: экран забирает вращение себе под выбор статуса, и,
# докрутив до него, выйти обратно вращением было бы уже нельзя.
manual = "manual.ManualScreen"

# Куда уводит очень долгое удержание (3 с). В карусель не входит:
# долистать до настроек случайно нельзя.
settings = "settings.SettingsScreen"

# Экраны покоя: включаются, когда радар не видит присутствия. В карусель
# не входят — стиль выбирается новый при каждом входе.
[ambient]
enabled = [
    "ambient.BigDigitsAmbient",
    "ambient.MatrixAmbient",
    "ambient.NightRedAmbient",
]

# Сколько ждать без присутствия перед уходом в покой. Меньше двух минут
# ставить не стоит: радар периодически теряет неподвижного человека, и
# экран начнёт дёргаться туда-сюда прямо во время работы.
away_delay_minutes = 3

# Ночью принудительно ночной стиль, независимо от очереди.
night_style = "ambient_night"
night_from = 23
night_to = 7

# Где мы находимся — для погоды. Аргументы --lat/--lon в командной строке
# перебивают эти значения; сервис автозапуска берёт их отсюда, потому что
# зашивать координаты в юнит systemd значит править их в двух местах.
[location]
# Белгород.
lat = 50.5997
lon = 36.5983

# ---------------------------------------------------------------------------
# Железо. Номера — GPIO (BCM), не физические номера ножек.
# Физическая распиновка: раздел 10.5 плана, уточнённый под ST7796S с тачем.
# ---------------------------------------------------------------------------
[display]
# CS у экрана — CE0, значит /dev/spidev0.0
spi_bus = 0
spi_device = 0
# 16 МГц. Начинали с 32, и на голом экране они держались. Но с тачем на
# той же шине появились три ответвления: каждое даёт отражения и заваливает
# фронты, и по картинке пошли горизонтальные полосы. Это не брак пайки —
# это физика шины, и лечится она снижением частоты.
#
# Кадр при этом уходит вдвое дольше, но нам всё равно: полный кадр рисуется
# редко, а частичная перерисовка гонит по шине единицы килобайт.
# Если полосы вернутся — снижать дальше, до 8 МГц.
speed_hz = 16000000
dc = 25          # pin 22
reset = 24       # pin 18
backlight = 18   # pin 12, аппаратный PWM
rotation_bgr = true   # у красных модулей порядок цветов BGR; синий вместо
                      # красного означает, что надо поставить false

[touch]
# Свой чип-селект CE1 -> /dev/spidev0.1, и своя скорость: XPT2046 больше
# двух мегагерц не держит, тогда как экран идёт на 32.
spi_bus = 0
spi_device = 1
speed_hz = 2000000
# Границы сырых значений АЦП. Свои для каждого экземпляра — заполняются
# скриптом tools/touch_calibrate.py, пока стоят типовые.
x_min = 300
x_max = 3800
y_min = 300
y_max = 3800
swap_xy = true
invert_x = false
invert_y = true
# Выше этого сопротивления касания нет. Сопротивление обратно силе: чем
# сильнее давят, тем оно меньше. Значит низкий порог и означает «дави
# сильнее» — при двух тысячах слои должны прижаться почти вплотную.
#
# Шесть тысяч отвечают спокойному нажатию пальцем. Поднимать почти
# безопасно: у нетронутой панели координата X читается нулём, и
# сопротивление тогда считается бесконечным при любом пороге. Проверено
# замером — 987 отсчётов подряд, ни одного конечного значения.
#
# Точное значение подбирает tools/touch_calibrate.py по вашим нажатиям.
max_resistance = 6000

# Ниже этого z1 панель считается нетронутой. Порог вспомогательный: шум
# покоя у нашей панели доходит до 38, то есть выше этого значения, и
# отсекает ложные касания на самом деле нулевая координата X. Тоже
# подбирается калибровкой.
z1_min = 16

[encoder]
clk = 17   # pin 11
dt = 27    # pin 13
sw = 22    # pin 15

[radar]
port = "/dev/serial0"
# Заводская скорость LD2410 именно такая, не 115200.
baud = 256000
# Инженерный режим даёт энергию по 9 воротам дальности — без неё панель
# калибровки бесполезна.
engineering = true

[air]
# П.6 плана: самокалибровку отключаем, иначе в редко проветриваемой
# комнате ноль CO2 медленно уезжает.
disable_asc = true
# Поправка на собственный нагрев: датчик греется от своей же платы и
# показывает больше комнатной. Значение вычитается из измеренного.
#
# Четыре градуса — заводская величина самого SCD41, под типовой модуль.
# Нашей сборке она, скорее всего, мала: плата стоит рядом с Pi и
# подсветкой. Подобрать сверкой с обычным термометром — поставить рядом,
# подождать час после включения и вписать разницу сюда.
#
# После сборки корпуса подбирать заново: поправка принадлежит корпусу, а
# не датчику. Подробности — в КОРПУС.md.
temperature_offset = 4.0
